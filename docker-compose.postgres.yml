services:
  grok-mcp:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      AUTH_MODE: none
      CONTENT_SOURCE: file
      CONTENT_FILE: /app/data/content.json
      LEDGER_DRIVER: postgres
      DATABASE_URL: postgres://grok:grok@postgres:5432/grok_mcp
    ports:
      - "3000:3000"
    volumes:
      - ./data/content.json:/app/data/content.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grok_mcp
      POSTGRES_USER: grok
      POSTGRES_PASSWORD: grok
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grok -d grok_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - grok_mcp_postgres:/var/lib/postgresql/data

volumes:
  grok_mcp_postgres:
